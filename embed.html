<body><main class="widget"><div class="head"><h1 class="brand">JAPAN HIDDEN GEMS</h1><a target="_blank" rel="noopener" href="./?view=ranking">Open JHG ↗</a></div><div class="config"><select id="region" aria-label="Region"><option value="">All regions</option><option value="JP">Japan</option><option value="EA">East Asia</option><option value="NA">North America</option><option value="SE">Southeast Asia</option><option value="ME">Middle East</option><option value="EU">Europe</option><option value="LA">Latin America</option><option value="SA">South Asia</option><option value="AF">Africa</option><option value="OC">Oceania</option></select></div><div id="songs">Loading…</div><p class="footer">Privacy-safe aggregate discovery ranking. No audio is hosted by JHG.</p></main>
<script>
const U='https://erfidvsxhhxogthyikgr.supabase.co',K='sb_publishable_ZFx5EEhesI7GfwX9eWyYpQ_4NKrb2Ge';let token='';
async function session(){if(token)return;const r=await fetch(U+'/auth/v1/signup',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error('Could not start a private JHG session.');token=(await r.json()).access_token}
