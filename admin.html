<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>曲管理 — Japan Hidden Gems</title>
  <link rel="stylesheet" href="admin.css?v=1" />
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">JAPAN HIDDEN GEMS</p>
        <h1>曲管理</h1>
      </div>
      <a href="index.html">一般サイトへ戻る</a>
    </header>

    <section id="loginPanel" class="panel">
      <h2>管理者ログイン</h2>
      <form id="loginForm">
        <label>メールアドレス<input id="adminEmail" type="email" autocomplete="username" required /></label>
        <label>パスワード<input id="adminPassword" type="password" autocomplete="current-password" required /></label>
        <button type="submit">ログイン</button>
      </form>
      <p id="loginError" class="error" aria-live="polite"></p>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="toolbar panel">
        <input id="songFilter" type="search" placeholder="曲名・アーティストを検索" />
        <select id="visibilityFilter">
          <option value="all">すべて</option>
          <option value="visible">公開中</option>
          <option value="hidden">非表示</option>
        </select>
        <button id="refreshSongs" type="button">再読み込み</button>
        <button id="backfillTags" type="button">既存曲をAIタグ付け</button>
        <button id="enrichSongMedia" type="button">YouTube・画像を補完（20曲）</button>
        <button id="clearSeedMetrics" class="danger" type="button">初期参考スコアを一括削除</button>
        <button id="logoutBtn" class="secondary" type="button">ログアウト</button>
      </div>
      <p id="adminStatus" class="status" aria-live="polite"></p>
      <section class="panel">
        <h2>利用者からのタグ報告</h2>
        <div id="tagReports" class="song-list"></div>
      </section>
      <h2>登録曲</h2>
      <div id="adminSongs" class="song-list"></div>
    </section>
  </main>

  <dialog id="deleteDialog">
    <form id="deleteForm">
      <h2>曲を完全削除</h2>
      <p>関連する推薦と評価もすべて削除され、元に戻せません。</p>
      <p>確認のため、次の曲名を正確に入力してください。</p>
      <strong id="deleteSongTitle"></strong>
      <input id="deleteConfirmation" type="text" autocomplete="off" required />
      <input id="deleteSongId" type="hidden" />
      <div class="dialog-actions">
        <button id="cancelDelete" class="secondary" type="button">キャンセル</button>
        <button class="danger" type="submit">完全削除</button>
      </div>
      <p id="deleteError" class="error" aria-live="polite"></p>
    </form>
  </dialog>

  <script src="admin.js?v=8"></script>
  <script src="admin-feedback.js?v=1"></script>
</body>
</html>
